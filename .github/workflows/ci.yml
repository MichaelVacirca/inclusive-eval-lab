name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Build, Test & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm install
      - run: npm run build -w core/eval-engine
      - run: npm run build -w domains/identity
      - run: npm run build -w domains/healthcare
      - run: npm run build -w domains/employment
      - run: npm run build -w domains/education
      - run: npm run build -w domains/content
      - run: npm run build -w packages/adversarial
      - run: npm run build -w packages/eval
      - run: npm run test -w core/eval-engine
      - run: npm run test -w domains/identity
      - run: npm run test -w domains/healthcare
      - run: npm run test -w domains/employment
      - run: npm run test -w domains/education
      - run: npm run test -w domains/content
      - run: npm run test -w packages/adversarial
      - run: npm run test -w packages/eval
      - run: npm run typecheck -w core/eval-engine
      - run: npm run typecheck -w domains/identity
      - run: npm run typecheck -w domains/healthcare
      - run: npm run typecheck -w domains/employment
      - run: npm run typecheck -w domains/education
      - run: npm run typecheck -w domains/content
      - run: npm run typecheck -w packages/adversarial
      - run: npm run typecheck -w packages/eval
      - run: npm run test:workflows
      - run: npm run typecheck:workflows

  site:
    name: Site Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: cd site && npm install && npm test && npm run build

  # actionlint checks workflow syntax, expressions and job wiring, and runs
  # shellcheck on every run: script.
  lint-workflows:
    name: Lint workflows
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # A pinned release binary, checked against the hash below before it is
      # unpacked or run. To upgrade, change both values and the copy of the
      # checksums in test/workflows/lint-workflows.test.ts. The hash is the
      # linux_amd64 line of the release's actionlint_<version>_checksums.txt.
      - name: Run actionlint
        env:
          ACTIONLINT_VERSION: "1.7.12"
          ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
        run: |
          if [ "$RUNNER_OS" != "Linux" ] || [ "$RUNNER_ARCH" != "X64" ]; then
            echo "::error::The pinned actionlint build is linux_amd64, but this runner is $RUNNER_OS $RUNNER_ARCH."
            exit 1
          fi
          # Without shellcheck, actionlint skips its run: script checks and
          # still passes.
          if ! command -v shellcheck >/dev/null; then
            echo "::error::shellcheck is not on PATH, so actionlint would not check run: scripts."
            exit 1
          fi
          tarball="$RUNNER_TEMP/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL --retry 3 --retry-connrefused -o "$tarball" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          sha256sum -c <<< "$ACTIONLINT_SHA256  $tarball"
          mkdir -p "$RUNNER_TEMP/actionlint"
          tar -xzf "$tarball" -C "$RUNNER_TEMP/actionlint" actionlint
          # From the repository root, actionlint lints .github/workflows/*.y{a,}ml.
          "$RUNNER_TEMP/actionlint/actionlint"
