name: Publish npm packages

# eval-v<version> releases the eight @inclusive-ai packages; alias-v<version>
# releases the inclusive-eval alias in alias/, which has its own version.
on:
  push:
    tags:
      - "eval-v*"
      - "alias-v*"

# One release at a time, and a publish that has started is never cancelled
# halfway through.
concurrency:
  group: publish-npm
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    # npm trusted publishing: each package on npmjs.com trusts this
    # repository, this workflow file and this environment, so no npm token is
    # stored anywhere. docs/releasing.md has the settings.
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      # Full history, so the tag can be checked against main.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check the tag is on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME is not on main. Tag a commit that has been merged."
            exit 1
          fi

      # No registry-url: npm defaults to registry.npmjs.org, and setup-node's
      # .npmrc would add a token placeholder that npm falls back
      # to when the OIDC exchange fails, hiding the real error. No dependency
      # cache either: a publish job should not restore a cache that other
      # workflow runs can write to.
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          package-manager-cache: false

      # The packages import each other, so install, build and test from the
      # repo root. Dependency install scripts are skipped, but the build and
      # test tools still run in this job, which can mint an OIDC token. The
      # alias has nothing to build and runs the published CLI, so an alias
      # release skips these steps; the release script needs only Node.
      - if: startsWith(github.ref_name, 'eval-v')
        run: npm ci --ignore-scripts
      - run: node scripts/release.mts check "$GITHUB_REF_NAME"
      - if: startsWith(github.ref_name, 'eval-v')
        run: npm run build
      - if: startsWith(github.ref_name, 'eval-v')
        run: npm run typecheck
      - if: startsWith(github.ref_name, 'eval-v')
        run: npm test

      # Dependencies first. Versions already on npm are skipped, so re-running
      # a failed release is safe. An alias release first checks that the CLI
      # version its range starts at is on npm.
      - run: node scripts/release.mts publish "$GITHUB_REF_NAME"
