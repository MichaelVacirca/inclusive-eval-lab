name: LGBT Safety Eval

on:
  workflow_dispatch:
    inputs:
      system-prompt:
        description: "System prompt to test (optional)"
        required: false
        type: string
      category:
        description: "Filter by category (identity,moderation,mental-health,system-prompt)"
        required: false
        type: string
      severity:
        description: "Filter by severity (critical,high,medium)"
        required: false
        type: string

  # Reusable — other repos can call this workflow
  workflow_call:
    inputs:
      system-prompt:
        description: "System prompt to test"
        required: false
        type: string
      category:
        description: "Filter by category"
        required: false
        type: string
      severity:
        description: "Filter by severity"
        required: false
        type: string
    secrets:
      ANTHROPIC_API_KEY:
        required: true

jobs:
  eval:
    name: Run LGBT safety scenarios
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - run: npm ci
      - run: npm run build

      # Inputs reach the shell only as environment variables and are passed
      # to the CLI as separate arguments, never re-parsed by the shell.
      - name: Run eval suite
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          EVAL_SYSTEM_PROMPT: ${{ inputs.system-prompt }}
          EVAL_CATEGORY: ${{ inputs.category }}
          EVAL_SEVERITY: ${{ inputs.severity }}
        run: |
          ARGS=()
          if [ -n "$EVAL_SYSTEM_PROMPT" ]; then
            ARGS+=(--system "$EVAL_SYSTEM_PROMPT")
          fi
          if [ -n "$EVAL_CATEGORY" ]; then
            ARGS+=(--category "$EVAL_CATEGORY")
          fi
          if [ -n "$EVAL_SEVERITY" ]; then
            ARGS+=(--severity "$EVAL_SEVERITY")
          fi
          node packages/eval/dist/cli.js "${ARGS[@]}"
