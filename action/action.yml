name: "Inclusive AI — LGBTQIA+ Safety Eval"
description: "Run LGBTQIA+ safety eval scenarios against your LLM system prompts and catch harms before you ship"
author: "InclusiveCode"

branding:
  icon: "shield"
  color: "purple"

inputs:
  anthropic-api-key:
    description: "Anthropic API key for running eval scenarios"
    required: true
  system-prompt:
    description: "System prompt to test against all scenarios"
    required: false
    default: ""
  domain:
    description: "Filter scenarios by domain (identity, healthcare, employment, education, or content)"
    required: false
    default: ""
  category:
    description: "Filter scenarios by category (comma-separated: identity,mental-health,moderation,system-prompt,output-safety,privacy,intersectionality,cultural-context,temporal-identity,transition-care,mental-health-intake,reproductive-health,provider-matching,medical-records,resume-screening,interview-ai,workplace-tools,content-filtering,student-ai,administrative-ai,research-tools,recommendation,moderation-parity,advertising,content-generation)"
    required: false
    default: ""
  severity:
    description: "Filter scenarios by severity (comma-separated: critical,high,medium)"
    required: false
    default: ""
  fail-on:
    description: "Lowest verdict that fails the step: FAIL (default) fails on FAIL, or VULNERABLE in red-team mode; NEEDS_WORK also fails on NEEDS_WORK, or PARTIAL in red-team mode"
    required: false
    default: "FAIL"
  adversarial:
    description: "Run the 30 standalone adversarial scenarios (attacks baked in). Produces standard EvalSummary output."
    required: false
    default: "false"
  red-team:
    description: "Run adversarial red-team mode: wraps selected domain scenarios with all 15 attack templates and reports bypass score. Use --domain to narrow scope."
    required: false
    default: "false"
  concurrency:
    description: "Number of parallel LLM calls for red-team mode (default: 5)"
    required: false
    default: "5"
  eval-version:
    description: "@inclusive-ai/eval version, range or dist-tag to install from npm (for example 3, 3.2.0 or ^3.2.0)"
    required: false
    default: "3"

runs:
  using: "composite"
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: 26
        package-manager-cache: false

    # The CLI goes into RUNNER_TEMP, not the caller's workspace, so the
    # caller's package.json, lockfile and node_modules are left alone, and no
    # dependency install scripts run.
    - name: Install @inclusive-ai/eval
      shell: bash
      env:
        EVAL_VERSION: ${{ inputs.eval-version }}
      run: |
        # A version, range or dist-tag only, as in the reusable workflow. npm
        # reads anything starting with "." as a directory and anything ending
        # in .tgz/.tar/.tar.gz as a tarball, and ":", "/", "@" and spaces as
        # URLs, paths, aliases or lists, so none of those get through.
        version_re='^[0-9A-Za-z^~*][0-9A-Za-z.^~*-]*$'
        tarball_re='\.(tgz|tar|tar\.gz)$'
        lower=$(printf '%s' "$EVAL_VERSION" | tr '[:upper:]' '[:lower:]')
        if ! [[ "$EVAL_VERSION" =~ $version_re ]] || [[ "$lower" =~ $tarball_re ]]; then
          echo '::error::eval-version must be a published version or tag (for example 3, 3.2.0, ^3.2.0 or latest).'
          exit 1
        fi
        npm install --no-save --ignore-scripts --no-audit --no-fund \
          --prefix "$RUNNER_TEMP/inclusive-eval" \
          "@inclusive-ai/eval@$EVAL_VERSION" "@anthropic-ai/sdk@^0.131.0"

    # Inputs reach the shell only as environment variables and are passed to
    # the CLI as separate arguments, never re-parsed by the shell.
    - name: Run LGBTQIA+ safety eval
      shell: bash
      env:
        ANTHROPIC_API_KEY: ${{ inputs.anthropic-api-key }}
        EVAL_SYSTEM_PROMPT: ${{ inputs.system-prompt }}
        EVAL_DOMAIN: ${{ inputs.domain }}
        EVAL_CATEGORY: ${{ inputs.category }}
        EVAL_SEVERITY: ${{ inputs.severity }}
        EVAL_ADVERSARIAL: ${{ inputs.adversarial }}
        EVAL_RED_TEAM: ${{ inputs.red-team }}
        EVAL_CONCURRENCY: ${{ inputs.concurrency }}
        EVAL_FAIL_ON: ${{ inputs.fail-on }}
      run: |
        FAIL_ON=$(printf '%s' "$EVAL_FAIL_ON" | tr '[:lower:]' '[:upper:]')
        case "$FAIL_ON" in
          "" | FAIL) FAIL_ON=FAIL ;;
          NEEDS_WORK) ;;
          *)
            echo '::error::fail-on must be FAIL or NEEDS_WORK.'
            exit 1
            ;;
        esac
        CLI="$RUNNER_TEMP/inclusive-eval/node_modules/.bin/inclusive-eval"
        if [ ! -x "$CLI" ]; then
          echo "::error::inclusive-eval CLI not found in RUNNER_TEMP. The install step should have put it there."
          exit 1
        fi
        ARGS=()
        if [ -n "$EVAL_SYSTEM_PROMPT" ]; then
          ARGS+=(--system "$EVAL_SYSTEM_PROMPT")
        fi
        if [ -n "$EVAL_DOMAIN" ]; then
          ARGS+=(--domain "$EVAL_DOMAIN")
        fi
        if [ -n "$EVAL_CATEGORY" ]; then
          ARGS+=(--category "$EVAL_CATEGORY")
        fi
        if [ -n "$EVAL_SEVERITY" ]; then
          ARGS+=(--severity "$EVAL_SEVERITY")
        fi
        if [ "$EVAL_ADVERSARIAL" = "true" ]; then
          ARGS+=(--adversarial)
        fi
        if [ "$EVAL_RED_TEAM" = "true" ]; then
          ARGS+=(--red-team)
        fi
        if [ -n "$EVAL_CONCURRENCY" ] && [ "$EVAL_CONCURRENCY" != "5" ]; then
          ARGS+=(--concurrency "$EVAL_CONCURRENCY")
        fi
        OUTPUT=$(mktemp "$RUNNER_TEMP/inclusive-eval-output.XXXXXX")
        EXIT_CODE=0
        "$CLI" "${ARGS[@]}" | tee "$OUTPUT" || EXIT_CODE=${PIPESTATUS[0]}
        # The CLI itself exits non-zero on FAIL (VULNERABLE in red-team mode).
        if [ "$EXIT_CODE" -ne 0 ] || [ "$FAIL_ON" = FAIL ]; then
          exit "$EXIT_CODE"
        fi
        # It exits 0 on NEEDS_WORK (PARTIAL in red-team mode), so read the
        # verdict it printed. The first "Verdict: " line is the summary's.
        VERDICT=$(awk '/^Verdict: /{v=$NF; sub(/\r$/, "", v); print v; exit}' "$OUTPUT")
        case "$VERDICT" in
          PASS | RESILIENT) ;;
          NEEDS_WORK | PARTIAL | FAIL | VULNERABLE)
            echo "::error::Verdict is $VERDICT and fail-on is NEEDS_WORK."
            exit 1
            ;;
          *)
            echo "::error::fail-on is NEEDS_WORK, but no verdict was found in the CLI output."
            exit 1
            ;;
        esac
